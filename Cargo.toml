[package]
name = "egui_ltreeview"
version = "0.6.2-dev"
edition = "2021"
authors = ["Leonard Schüngel <schuengel.leonard@gmail.com>"]
license = "MIT"
description = "A tree view widget for egui"
repository = "https://github.com/LennysLounge/egui_ltreeview"
categories = ["gui"]
keywords = ["egui", "gui", "widget", "tree"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE", "src/doc/doc.md"]

[package.metadata.docs.rs]
features = ["doc"]

[dependencies]
egui = { version = "0.37" }
serde = { version = "1", features = ["derive"], optional = true }
make_table_of_contents = { path = "make_table_of_contents", version = "0.1.0", optional = true }

[dev-dependencies]
eframe = "0.37"
egui_extras = { version = "0.37", features = ["all_loaders"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
uuid = { version = "1", features = ["v4", "js"] }
log = "0.4.27"
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70"

[features]
default = []
persistence = ["dep:serde", "egui/persistence", "uuid/serde"]
doc = ["dep:make_table_of_contents"]

[[example]]
name = "persistence_without_tree"
required-features = ["eframe/persistence"]

[[example]]
name = "persistence_with_tree"
required-features = ["eframe/persistence", "persistence"]

# egui is on `main` at 0.37.0, which crates.io does not have yet. The
# requirements above name 0.37 so that a consumer patching egui to `main`
# (akatela does) resolves a single egui rather than mixing 0.36 and 0.37; this
# block is what lets the crate build **standalone** in that window, the same
# device `egui_plot` upstream carries. Drop the block and the bumps together,
# taking 0.37 from crates.io, when it is released.
[patch.crates-io]
eframe = { git = "https://github.com/emilk/egui", branch = "main" }
egui = { git = "https://github.com/emilk/egui", branch = "main" }
egui_extras = { git = "https://github.com/emilk/egui", branch = "main" }
